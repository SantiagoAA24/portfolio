<!-- @dsCard group="Content" height=200 subtitle="Decision card and empty state" -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500&display=swap">
<div style="padding:32px;background:var(--bg);display:flex;flex-wrap:wrap;gap:20px">
  <div class="card" style="flex:1 1 280px">
    <div class="label label-accent">Decision</div>
    <div style="margin-top:12px;font-family:var(--font-display);font-size:22px;line-height:28px;font-weight:500">How the answers stay grounded</div>
    <p style="margin:10px 0 0;font-family:var(--font-body);font-size:16px;line-height:25px;color:var(--text-muted)">[Describe how you reduced made-up answers.]</p>
  </div>
  <div class="card card-dashed" style="flex:1 1 280px">
    <div style="font-family:var(--font-display);font-size:22px;line-height:28px;font-weight:500">More notes are on the way.</div>
    <p style="margin:10px 0 0;font-family:var(--font-body);font-size:16px;line-height:25px;color:var(--text-muted)">Follow along on LinkedIn.</p>
  </div>
</div>
